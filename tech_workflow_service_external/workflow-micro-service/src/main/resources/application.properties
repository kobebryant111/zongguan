server.port = 8081
server.servlet.context-path=/workflow-micro-service
spring.application.name= workflow-micro-service
#common.auth.exclude-path=/**

#\u52A0\u5BC6\u7684\u76D0
jasypt.encryptor.password=
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.iv-generator-classname=org.jasypt.iv.NoIvGenerator
jasypt.encryptor.encrypt-properties=spring.datasource.password
jasypt.encryptor.submodulename=workflow-micro-service

# oracle
spring.datasource.dialect=oracle

#tjmas \u7070\u5EA6\u53D1\u5E03
grayscale.enabled = true

#druid
spring.datasource.druid.initial-size=50
spring.datasource.druid.min-idle=50
spring.datasource.druid.maxActive=50
spring.datasource.druid.maxWait=60000
spring.datasource.druid.timeBetweenEvictionRunsMillis=60000
spring.datasource.druid.minEvictableIdleTimeMillis=300000
spring.datasource.druid.validationQuery=SELECT 1 FROM DUAL
spring.datasource.druid.testWhileIdle=true
spring.datasource.druid.testOnBorrow=false
spring.datasource.druid.testOnReturn=false
spring.datasource.druid.poolPreparedStatements=true
spring.datasource.druid.maxPoolPreparedStatementPerConnectionSize=20
spring.datasource.druid.filters=stat,wall,slf4j
spring.datasource.druid.connectionProperties=druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
spring.datasource.druid.web-stat-filter.enabled=true
spring.datasource.druid.web-stat-filter.url-pattern=/*
spring.datasource.druid.web-stat-filter.exclusions=*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*
spring.datasource.druid.stat-view-servlet.url-pattern=/druid/*
#spring.datasource.druid.stat-view-servlet.reset-enable=false
#spring.datasource.druid.stat-view-servlet.login-username=
#spring.datasource.druid.stat-view-servlet.login-password=

### msdp mybatis-plugins \u914D\u7F6E
mybatis-plus.config-location=classpath:mybatis/workflow-mybatis-config.xml
mybatis-plus.mapper-locations[0]=classpath*:mybatis/${spring.datasource.dialect}/**/*Mapper.xml
mybatis-plus.mapper-locations[1]= classpath*:mybatis/*Mapper.xml
mybatis-plus.mapper-locations[2]= classpath*:platform/mappings/**/*.xml
mybatis-plus.type-aliases-package=com.jeedev.msdp.**.entity

### redis
reids.enabled = true
spring.redis.database= 0

#\u96C6\u7FA4\u914D\u7F6E
spring.redis.port= 6379
spring.redis.jedis.pool.max-wait= 10000
spring.redis.jedis.pool.max-active= 30
spring.redis.jedis.pool.max-idle= 8
spring.redis.jedis.pool.min-idle= 0
spring.redis.timeout= 3000
management.health.refresh.enabled= true

### msdp \u662F\u5426\u4F7F\u7528\u672C\u5730\u6743\u9650\u6821\u9A8C
auth.local = true

### \u542F\u7528restTemplate
use.cloud.restTemplate = N

common.sysmgr.encryption = md5 #\u52A0\u5BC6\uFF08\u6280\uFF09\u672F md5|sms4

### msdp \u7981\u7528\u79DF\u6237
